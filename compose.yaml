name: commerce-operations
services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: commerce
    ports: ["127.0.0.1:55440:5432"]
    volumes: ["commerce-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:18.4
    profiles: [test]
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: commerce_test
    ports: ["127.0.0.1:55441:5432"]
    tmpfs: [/var/lib/postgresql]
volumes:
  commerce-data:
