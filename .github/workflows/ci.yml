name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:8.10.2
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: commerce_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://commerce:ci-synthetic-only@127.0.0.1:5432/commerce_test
      REDIS_URL: redis://127.0.0.1:6379/15
      SEED_PASSWORD: Synthetic-Test-Password
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Record the verified browser flow
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3100 > .tmp/demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3100/api/health
          node --import tsx scripts/record-demo.ts
      - run: npm audit --omit=dev --audit-level=low
      - run: npm audit --audit-level=low
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Build immutable application image
        run: docker build -t commerce-operations:${{ github.sha }} .
      - name: Smoke test the built image on loopback
        run: |
          docker run -d --name commerce-smoke --add-host host.docker.internal:host-gateway -p 127.0.0.1:3102:3100 -e DATABASE_URL=postgresql://commerce:ci-synthetic-only@host.docker.internal:5432/commerce_test commerce-operations:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3102/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3102/api/health
          docker stop commerce-smoke
      - name: Restore a real PostgreSQL backup into an isolated database
        run: |
          node --import tsx scripts/prepare-restore.ts
          docker exec ${{ job.services.postgres.id }} pg_dump -U commerce -Fc commerce_test > .tmp/backup.dump
          docker exec ${{ job.services.postgres.id }} createdb -U commerce commerce_restore_test
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U commerce -d commerce_restore_test < .tmp/backup.dump
          node --import tsx scripts/verify-restore.ts
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            .tmp/reports/
            .tmp/demo/commerce-flow.webm
            .tmp/*-operations.png
            test-results/
          include-hidden-files: true
