name: quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: commerce_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://commerce:ci-synthetic-only@127.0.0.1:5432/commerce_test
      SEED_PASSWORD: Synthetic-Test-Password
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=low
      - run: node scripts/audit-dependencies.mjs
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Build immutable application image
        run: docker build -t commerce-operations:${{ github.sha }} .
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            .tmp/reports/
            .tmp/*-operations.png
            test-results/
          include-hidden-files: true
